<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243d">
<title>مرکز خدمات اتحادیه MM</title>
<style>
:root{--navy:#10243d;--navy2:#173957;--blue:#2466d4;--cyan:#42cfc5;--paper:#f3f7fa;--ink:#17324b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink)}
body{overflow:hidden}
#app{position:relative;width:100%;height:100dvh;min-height:100%;overflow:hidden;background:var(--paper)}
.floating-channel{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 12px);right:14px;display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:14px;background:linear-gradient(135deg,#2879e8,#174fb8);color:#fff;text-decoration:none;font-weight:900;font-size:13px;box-shadow:0 7px 18px #174fb844}
.floating-channel svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.5}
#home{height:100%;overflow-y:auto;padding:92px 18px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.home-inner{width:min(100%,520px);margin:auto 0}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{width:74px;height:74px;margin:0 auto 13px;border-radius:24px;background:linear-gradient(145deg,#42d2c8,#168c9b);display:grid;place-items:center;box-shadow:0 12px 25px #168c9b35;color:white}
.brand-mark svg{width:45px;height:45px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:25px;line-height:1.5;margin:0;color:#14344f;font-weight:900}
.brand p{font-size:14px;color:#61788a;margin:8px 0 0;font-weight:700}
.prompt{text-align:center;font-size:17px;font-weight:900;color:#214b67;margin:0 0 15px}
.choices{display:grid;gap:13px}
.choice{width:100%;min-height:91px;border:1px solid #dce8ef;border-radius:21px;background:#fff;box-shadow:0 7px 20px #183d570d;display:flex;align-items:center;gap:16px;padding:16px 18px;text-align:right;color:var(--ink);font-family:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.choice:active{transform:scale(.985)}
.choice:hover{border-color:#79cfc9;box-shadow:0 9px 22px #183d5717}
.choice-icon{width:58px;height:58px;flex:0 0 58px;border-radius:18px;background:linear-gradient(145deg,#173b5a,#10243d);display:grid;place-items:center;color:#fff}
.choice-icon svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.choice-title{font-size:16px;font-weight:900;flex:1}
.choice-arrow{font-size:30px;line-height:1;color:#2a9ca3}
.home-footer{text-align:center;color:#8ba0ae;font-size:11px;margin-top:25px;font-weight:700}
#viewer{display:none;position:absolute;inset:0;padding-top:0;background:var(--paper)}
#contentFrame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
#viewer.active{display:block}
#home.hidden{display:none}
@media(min-width:600px){#home{padding-top:100px}.choice{min-height:100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <span class="choice-arrow" aria-hidden="true">‹</span>
    </button>
      </section>
      <footer class="home-footer">MM • Animal Rush</footer>
    </div>
  </main>
  <section id="viewer" aria-label="صفحه خدمات">

</div>

const home = document.getElementById('home');
const viewer = document.getElementById('viewer');
const frame = document.getElementById('contentFrame');
let currentPage = null;
function showPage(key, addHistory=true) {
  if (!pages[key]) return;
  currentPage = key;
  frame.srcdoc = decodeURIComponent(escape(atob(pages[key])));
  home.classList.add('hidden');
  viewer.classList.add('active');
  if (addHistory) history.pushState({mmView:key}, '', '#'+key);
}
function showHome(fromPop=false) {
  currentPage = null;
  viewer.classList.remove('active');
  home.classList.remove('hidden');
  frame.src = 'about:blank';
  if (!fromPop && location.hash) history.replaceState({mmView:'home'}, '', location.pathname + location.search);
}
document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page)));
window.addEventListener('popstate', (event) => {
  if (currentPage) showHome(true);
});
window.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && currentPage) {
    if (history.state && history.state.mmView) history.back();
    else showHome();
  }
});
history.replaceState({mmView:'home'}, '', location.pathname + location.search);
</script>
