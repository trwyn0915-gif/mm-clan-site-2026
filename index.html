<script>
const pages = {clan:'pages/clan.html',chat:'pages/chat.html',ads:'pages/ads.html'};
const home = document.getElementById('home');
const viewer = document.getElementById('viewer');
const frame = document.getElementById('contentFrame');
let currentPage = null;
function showPage(key, addHistory=true) {
  if (!pages[key]) return;
  currentPage = key;
  frame.src = pages[key];
  home.classList.add('hidden');
  viewer.classList.add('active');
  if (addHistory) history.pushState({mmView:key}, '', '#'+key);
}
function showHome(fromPop=false) {
  currentPage = null;
  viewer.classList.remove('active');
  home.classList.remove('hidden');
  frame.src = 'about:blank';
  if (!fromPop && location.hash) history.replaceState({mmView:'home'}, '', location.pathname + location.search);
}
document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page)));
window.addEventListener('popstate', (event) => {
  if (currentPage) showHome(true);
});
window.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && currentPage) {
    if (history.state && history.state.mmView) history.back();
    else showHome();
  }
});
history.replaceState({mmView:'home'}, '', location.pathname + location.search);

/* MM_HOME_BUTTON_SOUND_V1 */
(function(){
  let audioContext = null;
  function playButtonSound(){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    try {
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') audioContext.resume();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(620, now);
      oscillator.frequency.exponentialRampToValueAtTime(820, now + 0.055);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.24, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
      oscillator.connect(gain); gain.connect(audioContext.destination);
      oscillator.start(now); oscillator.stop(now + 0.09);
    } catch (error) {}
  }
  document.addEventListener('click', function(event){
    if (event.target.closest('button, .choice')) playButtonSound();
  });
})();
</script>
